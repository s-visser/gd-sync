name: Sync server into main

# Pulls the live server's files onto main. This is what keeps main honest when
# someone edits via cPanel, or a WordPress update rewrites a tracked file.
# Runs nightly, on demand, and automatically before any PR merge (see verify-main).
#
# It runs 'gd-sync sync --no-mirror' — the same command as on your computer,
# with the same excludes, minus the local copy of the whole site, which a
# worker has no use for. It only ever writes to this repo, never to the server.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_call:
    outputs:
      changed:
        description: Whether the server had drifted from main
        value: ${{ jobs.sync.outputs.changed }}

concurrency:
  group: server-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install gd-sync
        env:
          TOKEN: ${{ secrets.GD_SYNC_INSTALL_TOKEN }}
        run: |
          # A token is only needed while the gd-sync repository is private.
          if [ -n "$TOKEN" ]; then
            export GOPRIVATE=github.com/s-visser/gd-sync GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="url.https://x-access-token:${TOKEN}@github.com/s-visser/gd-sync.insteadOf"
            export GIT_CONFIG_VALUE_0="https://github.com/s-visser/gd-sync"
          fi
          go install github.com/s-visser/gd-sync/cmd/gd-sync@__GD_SYNC_VERSION__

      - name: Connection details
        env:
          SSH_KEY: ${{ secrets.GD_SYNC_SSH_KEY }}
          SSH_HOST: ${{ secrets.GD_SYNC_SSH_HOST }}
          SSH_USER: ${{ secrets.GD_SYNC_SSH_USER }}
          SSH_PORT: ${{ secrets.GD_SYNC_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'ssh_host = "%s"\nssh_user = "%s"\nssh_port = %s\n' "$SSH_HOST" "$SSH_USER" "${SSH_PORT:-22}" > .gd-sync.local.toml

      # What the server held last night, so only files that changed since are
      # downloaded. Losing it is harmless: the next sync just downloads more.
      - uses: actions/cache@v4
        with:
          path: .git/gd-sync/server
          key: gd-sync-state-${{ github.run_id }}
          restore-keys: gd-sync-state-

      - name: Sync
        id: sync
        run: |
          before=$(git rev-parse HEAD)
          gd-sync sync -y --no-mirror
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main already matches the server." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Server drift pulled into main"
              echo '```'
              git show --stat --oneline HEAD | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
