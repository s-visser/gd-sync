name: Deploy main to server

# main IS the server. Anything that lands on main gets pushed live.
# Commits made BY the sync worker are skipped — they already came from the server.
#
# It runs 'gd-sync deploy' — the same command as on your computer. It uploads
# only what main changed since the last sync or deploy, deletes only files git
# removed, and stops without touching anything if the server changed one of
# those files in the meantime. Files it doesn't know about are never deleted.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: server-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[server-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Load site manifest
        run: grep -E '^[A-Z_]+=' .gd-sync >> "$GITHUB_ENV"

      - name: Set up Node
        if: env.BUILD_CMD != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build
        if: env.BUILD_CMD != ''
        run: ${{ env.BUILD_CMD }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install gd-sync
        env:
          TOKEN: ${{ secrets.GD_SYNC_INSTALL_TOKEN }}
        run: |
          # A token is only needed while the gd-sync repository is private.
          if [ -n "$TOKEN" ]; then
            export GOPRIVATE=github.com/s-visser/gd-sync GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="url.https://x-access-token:${TOKEN}@github.com/s-visser/gd-sync.insteadOf"
            export GIT_CONFIG_VALUE_0="https://github.com/s-visser/gd-sync"
          fi
          go install github.com/s-visser/gd-sync/cmd/gd-sync@__GD_SYNC_VERSION__

      - name: Connection details
        env:
          SSH_KEY: ${{ secrets.GD_SYNC_SSH_KEY }}
          SSH_HOST: ${{ secrets.GD_SYNC_SSH_HOST }}
          SSH_USER: ${{ secrets.GD_SYNC_SSH_USER }}
          SSH_PORT: ${{ secrets.GD_SYNC_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'SSH_HOST=%s\nSSH_USER=%s\nSSH_PORT=%s\n' "$SSH_HOST" "$SSH_USER" "${SSH_PORT:-22}" > .gd-sync.local

      - name: Deploy
        run: gd-sync deploy -y

      - name: Summary
        run: echo "Deployed ${{ github.sha }} to $REMOTE_ROOT" >> "$GITHUB_STEP_SUMMARY"
