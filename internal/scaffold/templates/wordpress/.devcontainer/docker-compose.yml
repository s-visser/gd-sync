name: ${COMPOSE_PROJECT_NAME:-gd-sync-site}

# The web server and the workspace share one image, built on the PHP version
# the live site runs (PHP_VERSION, from .gd-sync via .env).
x-php: &php
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PHP_VERSION: ${PHP_VERSION:-8.3}
  image: gd-sync-wordpress:php${PHP_VERSION:-8.3}

services:
  # The container JetBrains / VS Code attaches to. Has wp-cli, composer and
  # the same PHP as the site.
  workspace:
    <<: *php
    user: vscode
    volumes:
      - ..:/workspace:cached
      - ..:/var/www/html:cached
      - ./wp-config.local.php:/var/www/html/wp-config.php:ro
      - ./htaccess:/var/www/html/.htaccess:ro
      - ..:/gd-sync/site:ro
    environment:
      LOCAL_URL: ${LOCAL_URL:-http://localhost:8080}
      LIVE_URL: ${LIVE_URL:-}
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  wordpress:
    <<: *php
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      LOCAL_URL: ${LOCAL_URL:-http://localhost:8080}
    volumes:
      # The whole site, straight from the repo's folder: the paths you maintain
      # plus gd-sync's local copy of everything else. Edit in the IDE, refresh
      # the browser, no rebuild.
      - ..:/var/www/html:cached
      # Local stand-ins for the two files that only work on the server. The
      # live ones stay untouched in the folder; this one reads the live
      # wp-config.php for its table prefix.
      - ./wp-config.local.php:/var/www/html/wp-config.php:ro
      - ./htaccess:/var/www/html/.htaccess:ro
      - ..:/gd-sync/site:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    ports:
      - "${DB_PORT:-13306}:3306"
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
      # anything gd-sync drops in _db/ can be imported from inside the container
      - ../_db:/dumps:cached
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Catches every email the site sends. Open http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-8025}:8025"

volumes:
  db-data:
