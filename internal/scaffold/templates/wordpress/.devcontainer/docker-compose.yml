name: ${COMPOSE_PROJECT_NAME:-gd-sync-site}

# The web server and the workspace share one image, built on the PHP version
# the live site runs (php_version in .gd-sync.toml, passed on through .env).
x-php: &php
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PHP_VERSION: ${PHP_VERSION:-8.3}
      GD_SYNC_VERSION: ${GD_SYNC_VERSION:-latest}
  image: gd-sync-wordpress:php${PHP_VERSION:-8.3}

# The live site's PHP limits (php_ini in .gd-sync.toml), which php.ini reads.
# The defaults are PHP's own, for a site that sets none.
x-php-ini: &php-ini
  PHP_INI_MEMORY_LIMIT: ${PHP_INI_MEMORY_LIMIT:-128M}
  PHP_INI_MAX_EXECUTION_TIME: ${PHP_INI_MAX_EXECUTION_TIME:-30}
  PHP_INI_MAX_INPUT_TIME: ${PHP_INI_MAX_INPUT_TIME:--1}
  PHP_INI_MAX_INPUT_VARS: ${PHP_INI_MAX_INPUT_VARS:-1000}
  PHP_INI_POST_MAX_SIZE: ${PHP_INI_POST_MAX_SIZE:-8M}
  PHP_INI_UPLOAD_MAX_FILESIZE: ${PHP_INI_UPLOAD_MAX_FILESIZE:-2M}

services:
  # The container JetBrains / VS Code attaches to. Has wp-cli, composer, git,
  # gh, gd-sync and the same PHP as the site.
  workspace:
    <<: *php
    user: vscode
    volumes:
      - ..:/workspace:cached
      - ..:/var/www/html:cached
      - ./wp-config.local.php:/var/www/html/wp-config.php:ro
      - ./htaccess:/var/www/html/.htaccess:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zz-gd-sync.ini:ro
      - ..:/gd-sync/site:ro
      # Your SSH keys and known hosts, so gd-sync reaches the server from in
      # here as it does from your computer.
      - ${HOME:-${USERPROFILE}}/.ssh:/home/vscode/.ssh
      # One GitHub login for every gd-sync site: run 'gh auth login' once.
      - gh-config:/home/vscode/.config/gh
    environment:
      <<: *php-ini
      LOCAL_URL: ${LOCAL_URL:-http://localhost:8080}
      LIVE_URL: ${LIVE_URL:-}
      # The ports on your computer (port, db_port, mail_port in .gd-sync.toml),
      # for post-create.sh to show.
      DB_PORT: ${DB_PORT:-13306}
      MAIL_PORT: ${MAIL_PORT:-8025}
      # Tells gd-sync it runs inside the devcontainer.
      GD_SYNC_CONTAINER: "1"
      # gh keeps its login on the shared volume, whatever XDG_CONFIG_HOME the
      # IDE sets (JetBrains points it into its own folder, which a rebuild wipes).
      GH_CONFIG_DIR: /home/vscode/.config/gh
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  wordpress:
    <<: *php
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      <<: *php-ini
      LOCAL_URL: ${LOCAL_URL:-http://localhost:8080}
    volumes:
      # The whole site, straight from the repo's folder: the paths you maintain
      # plus gd-sync's local copy of everything else. Edit in the IDE, refresh
      # the browser, no rebuild.
      - ..:/var/www/html:cached
      # Local stand-ins for the two files that only work on the server. The
      # live ones stay untouched in the folder; this one reads the live
      # wp-config.php for its table prefix.
      - ./wp-config.local.php:/var/www/html/wp-config.php:ro
      - ./htaccess:/var/www/html/.htaccess:ro
      # The live site's PHP limits, from .env.
      - ./php.ini:/usr/local/etc/php/conf.d/zz-gd-sync.ini:ro
      - ..:/gd-sync/site:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    ports:
      - "${DB_PORT:-13306}:3306"
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
      # anything gd-sync drops in _db/ can be imported from inside the container
      - ../_db:/dumps:cached
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Catches every email the site sends. Open http://localhost:<mail_port>
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-8025}:8025"

volumes:
  db-data:
  # Shared by every gd-sync site, so no one site's project owns it: created
  # before start by initializeCommand in devcontainer.json, or gd-sync up.
  gh-config:
    name: gd-sync-gh
    external: true
