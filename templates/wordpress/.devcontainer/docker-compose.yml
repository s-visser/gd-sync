name: ${COMPOSE_PROJECT_NAME:-gdsite}

services:
  # The container JetBrains / VS Code attaches to. Has wp-cli, php, node, rsync.
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - wp-core:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      LOCAL_URL: ${LOCAL_URL:-http://localhost:8080}
      LIVE_URL: ${LIVE_URL:-}
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
        /* send all mail to Mailpit instead of the outside world */
        define('WP_MAIL_SMTP_HOST', 'mailpit');
        define('WP_MAIL_SMTP_PORT', 1025);
    volumes:
      - wp-core:/var/www/html
      # Your tracked code, bind-mounted straight from the repo — edit in the IDE,
      # refresh the browser, no rebuild. Regenerate with: gd-sync scaffold <site>
      # __TRACKED_MOUNTS__
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    ports:
      - "${DB_PORT:-13306}:3306"
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
      # anything gd-sync drops in _db/ can be imported from inside the container
      - ../_db:/dumps:cached
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Catches every email the site sends. Open http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-8025}:8025"

volumes:
  wp-core:
  db-data:
