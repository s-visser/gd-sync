name: Deploy main to server

# main IS the server. Anything that lands on main gets pushed live.
# Commits made BY the sync worker are skipped — they already came from the server.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: server-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[server-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load site manifest
        run: cat .gdsync >> "$GITHUB_ENV"

      - name: Set up Node
        if: env.BUILD_CMD != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build
        if: env.BUILD_CMD != ''
        run: ${{ env.BUILD_CMD }}

      - name: Authorise SSH
        env:
          SSH_KEY: ${{ secrets.GD_SSH_KEY }}
          SSH_HOST: ${{ secrets.GD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.GD_SSH_PORT || 22 }}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Back up the current server files
        env:
          T: ${{ secrets.GD_SSH_USER }}@${{ secrets.GD_SSH_HOST }}
          P: ${{ secrets.GD_SSH_PORT || 22 }}
        run: |
          STAMP=$(date +%Y%m%d-%H%M%S)
          ssh -p "$P" "$T" "mkdir -p ~/gd-backups && cd '$REMOTE_ROOT' && \
            tar czf ~/gd-backups/deploy-$STAMP.tar.gz $TRACKED 2>/dev/null || true; \
            ls -1t ~/gd-backups/*.tar.gz 2>/dev/null | tail -n +21 | xargs -r rm --"
          echo "Backup: ~/gd-backups/deploy-$STAMP.tar.gz"

      - name: Upload
        env:
          T: ${{ secrets.GD_SSH_USER }}@${{ secrets.GD_SSH_HOST }}
          P: ${{ secrets.GD_SSH_PORT || 22 }}
        run: |
          set -eu
          RSH="ssh -p $P -o StrictHostKeyChecking=accept-new"
          COMMON="-az --delete --no-perms --no-owner --no-group --omit-dir-times
                  --exclude .git --exclude .github --exclude .devcontainer
                  --exclude .gdsync --exclude .idea --exclude .run
                  --exclude node_modules --exclude _db --exclude .DS_Store"

          if [ -n "${PUBLISH_DIR:-}" ]; then
            # static build: ship the build output into the web root
            rsync $COMMON -e "$RSH" "$PUBLISH_DIR/" "$T:$REMOTE_ROOT/"
          else
            for p in $TRACKED; do
              [ -e "$p" ] || { echo "skip $p (not in repo)"; continue; }
              if [ -d "$p" ]; then src="$p/"; dst="$REMOTE_ROOT/$p/"
              else src="$p"; dst="$REMOTE_ROOT/$p"; fi
              echo "-> $p"
              rsync $COMMON -e "$RSH" "$src" "$T:$dst"
            done
          fi

      - name: Summary
        run: echo "Deployed ${{ github.sha }} to $REMOTE_ROOT" >> "$GITHUB_STEP_SUMMARY"
