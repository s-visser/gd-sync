name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # On Windows the end-to-end tests skip themselves: their stand-in
      # server runs commands with bash. Ubuntu runs them against GNU tar,
      # the same tar a cPanel server has.
      - run: go test ./...
      - run: go build -o gd-sync-ci ./cmd/gd-sync
